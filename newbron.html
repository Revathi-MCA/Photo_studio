<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;">
    <button class="back-btn" onclick="goBack()">&#8592; Back</button>

  <div class="carousel-container">
    <div class="carousel">
      <img src="images/bab1.jpg" alt="Shoot 1" class="active">
      <img src="images/bab2.jpg" alt="Shoot 2">
      <img src="images/bab3.jpg" alt="Shoot 3">
      <img src="images/bab4.jpg" alt="Shoot 4">
      <img src="images/bab5.jpg" alt="Shoot 5">
      <img src="images/bab6.jpg" alt="Shoot 6">
      <img src="images/bab7.jpg" alt="Shoot 7">
      <img src="images/bab8.jpg" alt="Shoot 8">
      <img src="images/bab9.jpg" alt="Shoot 9">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
