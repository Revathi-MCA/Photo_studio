<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <nav>
            <a href="index.html" style="color: rgba(0, 0, 0, 0.758);">Home</a>
            <a href="gallery.html" style="color: rgba(0, 0, 0, 0.758);">Gallery</a>
            <a href="services.html" style="color: rgba(0, 0, 0, 0.758);">Services</a>
            <a href="shop.html" style="color: rgba(0, 0, 0, 0.758);">Shop</a>
            <a href="contact.html" style="color: rgba(0, 0, 0, 0.758);">Contact</a>
        </nav>
    </header>

    <h2 style="margin-top: 50px; padding-top: 50px;">Contact Us</h2>
    <div class="contact">
        <form onsubmit="sendToWhatsApp(event)">
            <label>Name</label>
            <input type="text" id="name" placeholder="Name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Email" required>

            <label>Contact Number</label>
            <input type="number" id="phone" placeholder="+91 1234567890" required>

            <label>Date Of Wedding</label>
            <input type="date" id="date" required>

            <label>Tell Us About Your Plan</label>
            <textarea id="plan" placeholder="Type here..." required></textarea>

            <button class="btn" type="submit">Submit</button>
        </form>
    </div>

    <div class="footer">
        <div class="icon">
            <a href="https://www.facebook.com/yourpage"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/thoozhaa"><i class="fa-brands fa-instagram"></i></a>
            <a href="mailto:vjaigrylls@gmail.com"><i class="fa-solid fa-envelope"></i></a>
        </div>
        <div class="info">
            <p>Thoozhaa Studio Photography</p>
            <p>Main road, Karkathi, Thiruvarur - 612203</p>
            <p>+91 8940048067</p>
            <p>vjaigrylls@gmail.com</p>
        </div>
        <div><p>Freeze The Time</p></div>
    </div>

    <script>
        async function sendToWhatsApp(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let date = document.getElementById("date").value;
            let plan = document.getElementById("plan").value;

            // Save to MongoDB
            try {
                await fetch('http://localhost:5000/api/contacts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, date, plan })
                });
            } catch(e) {
                console.log("Save failed:", e);
            }

            // Send to WhatsApp
            let whatsappNumber = "918940048067";

            let message =
                "📩 *Booking a Photographer*\n\n" +
                "*Name:* " + name + "\n" +
                "*Email:* " + email + "\n" +
                "*Phone:* " + phone + "\n" +
                "*Wedding Date:* " + date + "\n" +
                "*Plan:* " + plan;

            let url = "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message);
            window.open(url, "_blank");
        }
    </script>
</body>
</html>
