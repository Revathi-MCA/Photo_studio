<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Thoozhaa</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f4f1ec;
      --accent: #c9a96e;
      --accent-dark: #b8904f;
      --sidebar: #1c1c1e;
      --text: #1c1c1e;
      --muted: #888;
      --border: #e8e2d9;
      --card-bg: #ffffff;
      --danger: #e05c5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Background decorative circles */
    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,169,110,0.12), transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(28,28,30,0.06), transparent 70%);
      bottom: -80px; left: -80px;
      pointer-events: none;
    }

    .login-wrapper {
      display: flex;
      width: 820px;
      min-height: 500px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      position: relative;
      z-index: 1;
    }

    /* Left panel */
    .login-left {
      width: 340px;
      background: var(--sidebar);
      padding: 52px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .login-left::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      border: 40px solid rgba(201,169,110,0.08);
      bottom: -80px; right: -80px;
    }
    .login-left::after {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      border-radius: 50%;
      border: 30px solid rgba(201,169,110,0.06);
      top: -40px; left: -40px;
    }
    .brand {
      position: relative; z-index: 1;
    }
    .brand-name {
      font-family: 'Playfair Display', serif;
      color: var(--accent);
      font-size: 32px;
      letter-spacing: 1px;
      line-height: 1;
      margin-bottom: 6px;
    }
    .brand-sub {
      font-size: 11px;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .left-content {
      position: relative; z-index: 1;
    }
    .left-content h3 {
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: 22px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .left-content p {
      color: #666;
      font-size: 13px;
      line-height: 1.7;
    }
    .left-dots {
      display: flex; gap: 8px;
      position: relative; z-index: 1;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #333;
    }
    .dot.active { background: var(--accent); }

    /* Right panel */
    .login-right {
      flex: 1;
      background: var(--card-bg);
      padding: 52px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-right h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .login-right .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
    }
    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201,169,110,0.12);
      background: #fff;
    }
    /* Toggle password */
    .toggle-pw {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      background: none; border: none; padding: 0;
      width: auto;
    }
    .toggle-pw:hover { color: var(--accent); background: none; }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--sidebar);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px;
    }
    .login-btn:hover { background: #2e2e30; }
    .login-btn:active { transform: scale(0.98); }

    .error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 20px;
    }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0 0;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
    .divider span { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

    /* Shake animation on error */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    @media (max-width: 680px) {
      .login-left { display: none; }
      .login-wrapper { width: 360px; border-radius: 16px; }
      .login-right { padding: 40px 32px; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <!-- Left Panel -->
    <div class="login-left">
      <div class="brand">
        <div class="brand-name">Thoozhaa</div>
        <div class="brand-sub">Studio Photography</div>
      </div>
      <div class="left-content">
        <h3>Welcome back to your Admin Panel</h3>
        <p>Manage your gallery, enquiries, services, and more — all in one place.</p>
      </div>
      <div class="left-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="login-right">
      <h2>Sign In</h2>
      <p class="subtitle">Enter your credentials to access the dashboard</p>

      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Enter username" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Enter password" required>
            <button type="button" class="toggle-pw" onclick="togglePassword()" id="toggleIcon">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn">
          <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
        </button>

        <p id="error-message" class="error"></p>
      </form>

      <div class="divider">
        <hr><span>Freeze The Time</span><hr>
      </div>
    </div>

  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');
      const form = document.getElementById('loginForm');

      if (username === 'Thoozhaa' && password === 'Vijayan') {
        window.location.href = "deshboard.html";
      } else {
        errorMessage.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Invalid username or password.';
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 400);
      }
    });
  </script>

</body>
</html>
