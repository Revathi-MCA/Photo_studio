  <script>
  async function loadGallery() {
    try {
      const response = await fetch("http://localhost:5000/api/images");
      const images = await response.json();
      const gallery = document.getElementById("gallery");

      // Insert each uploaded image at the top
      images.forEach((img) => {
        const layoutClasses = ["gallery-item", "gallery-item tall", "gallery-item big"];
        const randomClass = layoutClasses[Math.floor(Math.random() * layoutClasses.length)];

        const div = document.createElement("div");
        div.className = randomClass;
        const imgURL = `http://localhost:5000/${img.path.replace(/\\/g, '/')}`;
        div.innerHTML = `<img src="${imgURL}" alt="Uploaded Photo">`;

        // ✅ Add image to top
        gallery.insertBefore(div, gallery.firstChild);
      });

      // Animation effect
      setTimeout(() => {
        document.querySelectorAll('.gallery-item').forEach((el, i) => {
          setTimeout(() => el.classList.add('show'), i * 100);
        });
      }, 100);
    } catch (error) {
      console.error("Error loading gallery:", error);
    }
  }

  document.addEventListener("DOMContentLoaded", loadGallery);


</script>
